<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Сообщения</title>

    <link rel="stylesheet" href="chat.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div class="chat">

        <!-- Шапка чата (имя и аватар подставляет chat.js) -->
        <div class="chat-header">

            <a href="messages.html" class="logo-button">
                <img src="icons/back.png" alt="Назад" class="button-logo">
            </a>

            <div class="chat-info">
                <div class="chat-name" id="chatName"></div>
                <div class="chat-status" id="chatStatus"></div>
            </div>

            <a href="profile.html?type=character" class="avatar-link" id="avatarLink">
                <img
                    src=""
                    class="chat-avatar"
                    id="chatAvatar"
                    alt=""
                >
            </a>

        </div>


        <!-- Область сообщений -->
        <div class="messages" id="messages"></div>


        <!-- Поле ввода -->
        <div class="message-input">

            <input
                type="text"
                id="message-input"
                placeholder="Написать сообщение..."
                maxlength="1000"
                autocomplete="off"
            >

            <button id="send-button">
                ➤
            </button>

        </div>

    </div>


    <script src="characters.js"></script>
    <script src="chat.js"></script>

</body>
</html>
