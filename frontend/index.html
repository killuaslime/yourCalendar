<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой календарь</title>

    <link rel="stylesheet" href="style.css">
</head>
 <body>

    <div class="header">
        <h1 style="text-align: center;">Твой календарь</h1>
        <button class="logo-calendar">  
            <img src="icons/calendar.png" alt="Календарь" class="button-logo">        
        </button>
    </div>
    <div class="date-strip">
        <div class="date">
            <span class="weekday">M</span>
            <span class="number">28</span>
        </div>

        <div class="date">
            <span class="weekday">T</span>
            <div class="date today">
                <span class="number">29</span>
            </div>
        </div>

        <div class="date">
            <span class="weekday">W</span>
            <span class="number">30</span>
        </div>

        <div class="date">
            <span class="weekday">T</span>
            <span class="number">1</span>
        </div>

        <div class="date">
            <span class="weekday">F</span>
            <span class="number">2</span>
        </div>

        <div class="date">
            <span class="weekday">S</span>
            <span class="number">3</span>
        </div>

        <div class="date">
            <span class="weekday">S</span>
            <span class="number">4</span>
        </div>

    </div>

    <div id="calendar">
        <h2>Календарь</h2>

        <!-- здесь позже будет полноценный календарь -->

    </div>
    <div class="buttons">
        <a href="index.html" class="logo-button">
            <img src="icons/homepage.png" alt="Чат" class="button-logo">
        </a>
        <a href="chat.html" class="logo-button">
            <img src="icons/chat.png" alt="Чат" class="button-logo">
        </a>

        <a href="settings.html" class="logo-button">
            <img src="icons/settings.png" alt="Чат" class="button-logo">
        </a>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="index.js"></script>
</body>
</html>
