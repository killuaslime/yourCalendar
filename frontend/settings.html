<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Настройки — Твой календарь</title>

    <link rel="stylesheet" href="styles/settings.css">

    <link rel="stylesheet" href="styles/transitions.css">
    <script src="scripts/transitions.js"></script>
</head>

<body>

    <!-- Шапка профиля -->
    <div class="settings-header">

        <!-- Кнопка назад -->
        <a href="index.html" class="back-button" data-back>
            <img src="icons/back.png" alt="Назад">
        </a>

        <!-- Аватар -->
        <a href="profile.html?type=user" class="avatar-link">
            <img
                src="avatars/userPicture.png"
                alt="Аватар пользователя"
                class="user-avatar"
            >
        </a>

        <!-- Информация пользователя -->
        <div class="settings-info">

            <div class="user-profile">
                User name
            </div>

            <div class="user-name">
                @username
            </div>

            <div class="subscribe">
                Подписка: бесплатная
            </div>

        </div>

    </div>


    <!-- Настройки -->
    <div class="settings-list">

        <!-- Темная тема -->
        <div class="settings-item">

            <div class="setting-text">

                <div class="setting-title">
                    Темная тема
                </div>

                <div class="setting-description">
                    Изменить оформление приложения
                </div>

            </div>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="btnToggle"
                >

                <span class="slider"></span>

            </label>

        </div>


        <!-- Выбор фона -->
        <a
            href="chooseBG.html"
            class="settings-item"
        >

            <div class="setting-text">

                <div class="setting-title">
                    Выбрать фон
                </div>

                <div class="setting-description">
                    Настроить внешний вид приложения
                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </a>


        <!-- Персонаж -->
        <div class="settings-item">

            <div class="setting-text">

                <div class="setting-title">
                    Персонаж
                </div>

                <div class="setting-description">
                    Настроить твоего персонажа
                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </div>


        <!-- Уведомления -->
        <div class="settings-item">

            <div class="setting-text">

                <div class="setting-title">
                    Уведомления
                </div>

                <div class="setting-description">
                    Настройки уведомлений
                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </div>

    </div>

</body>

</html>
