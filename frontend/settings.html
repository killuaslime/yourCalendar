
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Настройки</title>

    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="settings-header">
        <!-- Шапка -->
        <a href="index.html" class="logo-button">
            <img src="icons/back.png" alt="Назад" class="button-logo">
        </a>
        

        <div class="settings-info">
            <div class="user-profile">User name</div>
            <div class="user-name">@username</div>
            <div class="subscribe">подписка: бесплатная</div>
        </div>
        <img src="avatars/userPicture.png" alt="user avatar" class="user-avatar">
    </div> 
    <div class="settings-theme">
        <!-- Настройка темы -->
        <div class="theme-text">Включить темную тему: </div>
        <label class="toggle">
            <input type="checkbox" id="btnToggle" name="btnToggle" />
            <span class="slider"></span>
        </label>
    </div>
    <div class="choose-background">
        <a href="chooseBG.html">
        <div>Выбрать фон</div>
        </a>
    </div>

    
</body>
